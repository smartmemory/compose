name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

# Read-only GITHUB_TOKEN, one run per ref (ACTIONS-LOCKDOWN-1).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # git identity for tests that make real commits in temp dirs
      - name: Configure git
        run: |
          git config --global user.email "ci@smartmemory.ai"
          git config --global user.name "compose-ci"

      - name: Install
        run: npm install

      - name: Build publishable cockpit
        run: npm run build

      - name: Test
        run: npm test
