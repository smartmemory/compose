# metadata:
#   id: content
#   label: "Content"
#   description: "Write documentation or content — research, draft, review, publish"
#   category: documentation
#   steps: 4
#   estimated_minutes: 20

version: 1

# content pipeline
#
# Four-step flow for documentation and content creation:
#   1. research  — gather context, read existing docs, identify gaps
#   2. draft     — write the content
#   3. review    — review for accuracy, completeness, and clarity
#   4. publish   — finalize and commit
#
# COMP-PIPELINE-QUARANTINE: re-authored from v0.1 to TS v1. Linear chain, no
# gates or backward routing. `retries: N` -> `attempts: N + 1` (v0.1 counted
# retries AFTER the first try). The `outcome` enum moved into the contract.
# review's fix loop is its own `attempts` budget: `ensure` rejects an unclean
# review and the engine re-runs the step with the findings as feedback.
#
#
# COMP-PIPELINE-QUARANTINE round 2: the flow input is the RUNNER's envelope, not
# a bespoke `task`. runBuild derives plan inputs from the MODE, not from the spec
# (lib/build.js startFresh), and feature mode always sends
# {featureCode, description, implementer_agent, reviewer_agent} plus an optional
# pre_merge_gate. Declaring `task` meant this spec resolved but could never plan —
# making it reachable via `--template` without this change just moved the failure
# from "not found" to a failed run. `${input.description}` carries what `task` did.
# Inputs (the runner's feature envelope):
#   featureCode  — the feature/work code
#   description  — what to do; this is what the old `task` input carried

contracts:
  ContentResult:
    phase: string
    artifact: string
    summary: string
    outcome: complete|skipped|failed   # `skipped` is reachable: compose offers an interactive skip

  # CANONICAL ReviewResult — STRAT-CLAUDE-EFFORT-PARITY. It MUST carry meta,
  # lenses_run, auto_fixes and asks even though this pipeline never sets them by
  # hand: compose enables review normalization for any step whose out contract is
  # NAMED ReviewResult (deriveOrdinaryReviewScaffold), and the normalizer always
  # stamps those four fields. Engine contracts are strict, so a narrower
  # declaration makes every review step fail with unrecognized_keys and exhaust
  # its attempts — the same defect class as COMP-SHIP-CONTRACT. Caught in review.
  ReviewResult:
    clean: boolean
    summary: string
    findings: array
    meta: object
    lenses_run: string[]
    auto_fixes: array
    asks: array

flows:
  entry: content
  content:
    input:
      route_mode: string?
      routing_start: string?
      routing_root: string?
      routing_plan_intent: string?
      routing_continuation: string?
      featureCode: string
      description: string
      implementer_agent: string?
      reviewer_agent: string?
      pre_merge_gate: string[]?
    output:
      from: "${publish.output}"
      contract: ContentResult
    steps:
      - id: research
        agent: claude
        do: >
          Gather context for this content: ${input.description}. Read existing
          documentation, related code and prior art. Identify gaps and outline
          the key topics to cover. Return a summary of research findings.
        out: ContentResult
        attempts: 2

      - id: draft
        after: [research]
        agent: claude
        do: >
          Write the content for ${input.description} based on the research findings:
          ${research.output.summary}. Follow existing documentation conventions
          and standards. Write to the appropriate file path and return the
          artifact path.
        out: ContentResult
        ensure:
          - expr: "result.outcome == 'complete'"
        attempts: 3

      - id: review
        after: [draft]
        agent: claude
        do: >
          Review the drafted content at ${draft.output.artifact} for accuracy,
          completeness and clarity. Check that every claim is supported by code
          or documentation. If this is a retry, fix the previous findings before
          re-reviewing. Return { "clean": boolean, "summary": string,
          "findings": string[] }.
        out: ReviewResult
        ensure:
          - expr: "result.clean == true"
        attempts: 4

      - id: publish
        after: [review]
        agent: claude
        do: >
          Finalize the content for ${input.description}. Update any cross-references
          (README, CHANGELOG, index files). Commit with a descriptive message.
        out: ContentResult
        attempts: 2
