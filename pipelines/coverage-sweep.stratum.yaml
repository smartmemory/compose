# metadata:
#   id: coverage-sweep
#   label: "Coverage Sweep"
#   description: "Run test suite in a loop until all tests pass"
#   category: quality
#   steps: 1
#   estimated_minutes: 10

version: 1

# coverage-sweep pipeline
#
# Runs the test suite until it passes. The loop is the step's own `attempts`
# budget: `ensure` rejects a run with failures, the engine retries the step with
# the previous failure as feedback, and the step only settles when the suite is
# green. Same pattern as review-fix.stratum.yaml but for test coverage.
#
# COMP-PIPELINE-QUARANTINE: re-authored from v0.1 to TS v1. `retries: 15` became
# `attempts: 16` — v0.1 counted retries AFTER the first try, so a bare rename
# would have cost this pipeline a run.
#
# DELIBERATE BEHAVIOR CHANGE (owner decision, not a side effect of the dialect
# move): the v0.1 prompt only RAN the suite and reported failures, so a retry
# re-ran identical code and reported the identical failure up to fifteen times —
# a loop that could not converge. The step now fixes what it finds before the
# next attempt, which is what makes the retry budget meaningful. This makes the
# pipeline write-capable, so it is no longer safe to treat as read-only.
#
#
# COMP-PIPELINE-QUARANTINE round 2: the flow input is the RUNNER's envelope, not
# a bespoke `task`. runBuild derives plan inputs from the MODE, not from the spec
# (lib/build.js startFresh), and feature mode always sends
# {featureCode, description, implementer_agent, reviewer_agent} plus an optional
# pre_merge_gate. Declaring `task` meant this spec resolved but could never plan —
# making it reachable via `--template` without this change just moved the failure
# from "not found" to a failed run. `${input.description}` carries what `task` did.
# Inputs (the runner's feature envelope):
#   featureCode  — the feature/work code
#   description  — what to do; this is what the old `task` input carried

contracts:
  CoverageResult:
    passing: boolean
    summary: string
    failures: string[]

flows:
  entry: coverage_sweep
  coverage_sweep:
    input:
      featureCode: string
      description: string
      implementer_agent: string?
      reviewer_agent: string?
      pre_merge_gate: string[]?
    output:
      from: "${sweep.output}"
      contract: CoverageResult
    steps:
      - id: sweep
        agent: claude
        do: >
          Run the project test suite for ${input.description}. Return structured JSON:
          { "passing": boolean, "summary": string, "failures": string[] }.
          Set passing=true only if all tests pass with no failures.
          If tests fail, list each failing test name in the failures array and
          fix them before the next attempt.
        out: CoverageResult
        ensure:
          - expr: "result.passing == true"
        attempts: 16
