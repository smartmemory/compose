version: 1

# COMP-ROADMAP-PLAN — the `plan` product-planning lifecycle (peer to build/fix).
# Front half of goal-to-product: frame → research → ideate → converge → estimate
# → build-handshake. Top-level step IDs MUST equal the plan-mode phaseOrder
# (explore_design / plan / ship) because phase tracking keys off the raw step_id
# (lib/build.js). Flow input is {projectName, intent} to match the plan-mode
# planInputs envelope (lib/lifecycle-modes.js plan.runner.planInputs == 'plan').
# Absorbs `compose new`: ideation routes to the ideabox, output is canonical
# feature.json (not hand-authored ROADMAP rows or design.md-only seeds).
#
# COMP-PIPELINE-QUARANTINE: re-authored from v0.3 to TS v1, which is what makes
# `compose plan` runnable again — it had been dead since the STRAT-PY-RETIRE
# cutover, and was edited on 2026-08-05 while already unrunnable.
#   - The `workflow:` header and the `functions:` gate declarations are gone; v1
#     declares flow input on the flow and gates inline as `gate:` blocks. The
#     approve/revise/kill routing is carried over unchanged, including the
#     backward `on_revise` edges, which v1 gates express natively.
#   - Interpolation moves from single-brace `{intent}` to `${input.intent}`, and
#     step references from `$.steps.plan.output.created` to `${plan.output.created}`.
#     The `{{...}}` escape the old templater needed for literal JSON braces is no
#     longer required, so those are plain braces now.
#   - `retries: N` -> `attempts: N + 1` (v0.3 counted retries AFTER the first try).

contracts:
  PlanDesignResult:
    artifact: string
    features: string[]
    summary: string

  PlanConvergeResult:
    artifact: string
    created: string[]
    summary: string

  PlanHandoffResult:
    handed_off: string[]
    summary: string

flows:
  entry: plan
  plan:
    input:
      projectName: string
      intent: string
    output:
      from: "${ship.output}"
      contract: PlanHandoffResult
    max_rounds: 10
    steps:
      # Phase: explore_design — frame, research, ideate
      - id: explore_design
        agent: claude
        do: >
          You are running the PRODUCT-PLANNING front half for this intent:
          ${input.intent}

          Do three things, then write the result to
          docs/plans/${input.projectName}/design.md:
          1. FRAME — restate the goal, the problem it solves, who it is for, and the
             scope boundaries (what is in v1, what is explicitly out).
          2. RESEARCH — search the web and the codebase for prior art, existing
             tools, architectural patterns, and risks. Summarize what is relevant.
          3. IDEATE — propose candidate features (each with a short code and a
             one-line description, ordered by dependency). Capture each idea with
             `compose ideabox add "<title>" [--desc ...] [--cluster ...]` so ideation
             lives in the funnel, not here. Do NOT edit docs/product/ideabox.md
             directly: it is generated output now, and an edit to it is discarded by
             the next render. Then shortlist the features you recommend building first.

          Write docs/plans/${input.projectName}/design.md containing FRAME, RESEARCH,
          and the shortlist (with feature codes). Return its path in "artifact" and the
          shortlisted feature codes in "features".
        out: PlanDesignResult
        ensure:
          - expr: "file_exists(result.artifact)"
          - expr: "len(result.features) > 0"
        attempts: 3

      # Gate: human reviews the framing + research + shortlist
      - id: plan_design_gate
        after: [explore_design]
        gate:
          on_approve: plan
          on_revise: explore_design
          on_kill: null

      # Phase: plan — converge, estimate, write build-ready specs
      - id: plan
        after: [plan_design_gate]
        agent: claude
        do: >
          Converge the shortlist in docs/plans/${input.projectName}/design.md into
          build-ready feature specs. For EACH feature you commit to building:
          1. ESTIMATE — assign a complexity (S | M | L | XL) and a triage build
             profile (which lifecycle phases it needs, e.g.
             {"needs_prd": false, "needs_architecture": false}).
          2. SPEC — first write the per-feature design to <CODE>/design.md inside the
             project features dir (docs/features/<CODE>/design.md by default, or the
             paths.features root in .compose/compose.json). This is a real
             product/feature design the build lifecycle will ratify. THEN create the
             canonical feature.json by RUNNING this command from the project root
             (it writes feature.json via the canonical writer, regenerates ROADMAP.md,
             and auto-stamps triageTimestamp — works from any agent runtime, no MCP
             needed):

               compose roadmap add <CODE> --description "<one-line>" --phase "<phase>" \
                 --status PLANNED --complexity <S|M|L|XL> \
                 --profile '{"needs_prd":<bool>,"needs_architecture":<bool>,"needs_verification":<bool>,"needs_report":<bool>}' \
                 --planned-by "${input.projectName}" [--impact <low|medium|high>]

             Write design.md BEFORE running it (the command verifies design.md exists
             and refuses otherwise). Do NOT hand-author ROADMAP rows or write
             feature.json by hand.

          Then write the planning narrative (decisions, estimates, sequencing) to
          docs/plans/${input.projectName}/plan.md. Return plan.md in "artifact" and the
          created feature codes in "created".
        out: PlanConvergeResult
        ensure:
          - expr: "file_exists(result.artifact)"
          - expr: "len(result.created) > 0"
        attempts: 3

      # Gate: human approves the converged plan + build-ready specs
      - id: plan_converge_gate
        after: [plan]
        gate:
          on_approve: ship
          on_revise: plan
          on_kill: null

      # Phase: ship — handoff / verify build-readiness (plan mode does NOT git-commit
      # here; runBuild's ship interception is gated off for mode=plan).
      - id: ship
        after: [plan_converge_gate]
        agent: claude
        do: >
          Finalize the plan-to-build handoff. For EACH feature code in
          ${plan.output.created} (the features the plan phase produced), verify its
          folder under the project features dir (docs/features/<CODE>/ by default, or
          the paths.features root in .compose/compose.json) has a feature.json (status
          PLANNED, with plannedBy "${input.projectName}", complexity, profile,
          triageTimestamp) and a design.md. Produce a short handoff summary listing
          each build-ready feature and the exact `compose build <CODE>` command to
          start it. Do NOT git-commit here — just verify and summarize. Return the
          verified feature codes in "handed_off".
        out: PlanHandoffResult
        ensure:
          - expr: "len(result.handed_off) > 0"
        attempts: 2
