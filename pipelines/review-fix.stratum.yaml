# metadata:
#   id: review-fix
#   label: "Review & Fix"
#   description: "Iterative review-fix loop — Codex reviews, Claude fixes until clean"
#   category: quality
#   steps: 2
#   estimated_minutes: 15

version: 1

# review-fix pipeline
#
# Runs a task to completion via a two-phase loop:
#   1. execute  — claude produces the initial implementation
#   2. review   — codex reviews against the blueprint; on failure, claude fixes
#                 the findings before codex re-reviews
#
# The fix-then-review step is a single unit so findings always feed back into a
# fix pass before re-review runs. Its `attempts` budget is the iteration cap.
#
# COMP-PIPELINE-QUARANTINE: re-authored from v0.1 to TS v1.
#   - The two `functions:` collapse into inline `do` steps; v1 has no function table.
#   - `retries: 10` -> `attempts: 11` (v0.1 counted retries after the first try).
#   - The review step declares `agent: codex` directly, which is what the old
#     prose was asking the step to arrange through agent_run by hand. Cross-model
#     review is a first-class dispatch in v1, not something a step improvises.
#
# Inputs:
#   task      — what to implement (full task description with file paths, etc.)
#   blueprint — the feature blueprint to review against (file content or path)

contracts:
  ExecuteResult:
    summary: string
    findings: string[]

  ReviewResult:
    clean: boolean
    summary: string
    findings: string[]

flows:
  entry: review_fix
  review_fix:
    input:
      task: string
      blueprint: string
    output:
      from: "${review.output}"
      contract: ReviewResult
    steps:
      - id: execute
        agent: claude
        do: >
          Implement this task fully — write all required files and make all
          required changes: ${input.task}.
          Return a summary of what was done and an empty findings array.
          Do not review — only implement.
        out: ExecuteResult
        attempts: 2

      - id: review
        after: [execute]
        agent: codex
        do: >
          Perform one full fix-then-review cycle for ${input.task}.

          Step A — Fix (skip on the first attempt, when there are no prior findings):
            If this is a retry, the previous attempt's findings are in your
            feedback. Fix EVERY finding before proceeding. Never re-review
            without fixing first.

          Step B — Review:
            Review the implementation against the blueprint. What was
            implemented: ${execute.output.summary}. The blueprint is
            ${input.blueprint}.
            List actionable findings with confidence >= 7. Set clean=true only
            if no actionable findings remain.

          Return ReviewResult.
        out: ReviewResult
        ensure:
          - expr: "result.clean == true"
        attempts: 11
